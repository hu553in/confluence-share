name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          - '21'
          # renovate: datasource=java-version depName=java
          - '27'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: hu553in/common-things/.github/actions/setup-shfmt@main
      - run: make install-deps
      - run: make check
        env:
          PREK: uvx prek
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/preview.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: confluence-share-java-${{ matrix.java }}
          path: target/confluence-share-*.jar
          if-no-files-found: error
          retention-days: 14

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: hu553in/common-things/.github/workflows/submit-maven-dependencies.yml@main
    with:
      java_version: '27'
